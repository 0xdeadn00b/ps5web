name: docker

# 打 tag 或手动触发时，构建 amd64 + arm64 双架构镜像推到 Docker Hub。
# 需要先在仓库 Settings → Secrets and variables → Actions 里加两个 secret：
#   DOCKERHUB_USERNAME   你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN      Docker Hub 的 access token（别用登录密码）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '额外打一个 tag（可留空，只推 latest）'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ps5web
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHIAKI_REPO=https://github.com/chiaki-ng/chiaki-ng.git
            CHIAKI_REF=v1.10.1
            APT_MIRROR=http://mirrors.ustc.edu.cn/debian
            APT_SECURITY_MIRROR=http://mirrors.ustc.edu.cn/debian-security
          cache-from: type=gha
          cache-to: type=gha,mode=max
